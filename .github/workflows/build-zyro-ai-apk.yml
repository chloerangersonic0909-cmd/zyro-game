name: Build Zyro AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "zyro-ai-android/**"
      - ".github/workflows/build-zyro-ai-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: zyro-ai-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zyro-AI-APK
          path: zyro-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
